name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Railway
        uses: railwayapp/actions@v1
        with:
          token: ${{ secrets.RAILWAY_TOKEN }}
          service: backend

      - name: Deploy frontend to Railway
        uses: railwayapp/actions@v1
        with:
          token: ${{ secrets.RAILWAY_TOKEN }}
          service: frontend

  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Deployment Status
        run: echo "Deployment ${{ needs.deploy.result }}"
